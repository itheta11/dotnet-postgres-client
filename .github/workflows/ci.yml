name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pgclient
          POSTGRES_PASSWORD: pgclient
          POSTGRES_DB: pgclient
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgclient"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore PgClient.sln

      - name: Build
        run: dotnet build PgClient.sln --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/PgClient.Tests/PgClient.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=unit.trx"

      - name: Integration tests
        env:
          PGCLIENT_TEST_CONN: "localhost;5432;pgclient;pgclient;pgclient"
        run: dotnet test tests/PgClient.Tests/PgClient.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~Integration"

      - name: Pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet pack PgClient/PgClient.csproj --no-build --configuration Release --output artifacts

      - name: Upload package artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.*nupkg

  publish:
    name: Publish to NuGet
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
